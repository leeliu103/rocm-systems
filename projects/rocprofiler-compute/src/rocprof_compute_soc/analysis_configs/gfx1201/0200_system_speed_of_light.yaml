# RDNA4 (gfx1201)
Panel Config:
  id: 200
  title: System Speed-of-Light
  data source:
  - metric_table:
      id: 201
      title: System Speed-of-Light
      header:
        metric: Metric
        value: Avg
        unit: Unit
      metric:
        VALU Instruction Rate:
          value: SUM(SQ_INSTS_VALU_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GInstr/s
        FP64 VALU Instruction Rate:
          value: SUM(SQ_INSTS_VALU_DP_sum) / SUM(End_Timestamp - Start_Timestamp)
          unit: GInstr/s
        GL2 Cache Hit Rate:
          value: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          unit: Percent
        GL2-Fabric Read BW:
          value: SUM(GL2C_EA_RDREQ_32B_sum * 32 + GL2C_EA_RDREQ_64B_sum * 64 + GL2C_EA_RDREQ_128B_sum * 128 + GL2C_EA_RDREQ_256B_sum * 256 + GL2C_EA_RDREQ_COMPRESSED_128B_sum * 128 + GL2C_EA_RDREQ_COMPRESSED_256B_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        GL2-Fabric Write BW:
          value: SUM(GL2C_EA_WRREQ_32B_sum * 32 + GL2C_EA_WRREQ_64B_sum * 64 + GL2C_EA_WRREQ_128B_sum * 128 + GL2C_EA_WRREQ_256B_sum * 256 + GL2C_EA_WRREQ_COMPRESSED_128B_sum * 128 + GL2C_EA_WRREQ_COMPRESSED_256B_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        LDS Bank Conflict Cycles:
          value: AVG(SQC_LDS_BANK_CONFLICT_sum)
          unit: Counter cycles
        Wave Dependency Wait:
          value: 100 * SUM(SQ_WAIT_ANY_sum) / SUM(SQ_WAVE_CYCLES_sum)
          unit: Percent
        Wave Issue Wait:
          value: 100 * SUM(SQ_WAIT_INST_ANY_sum) / SUM(SQ_WAVE_CYCLES_sum)
          unit: Percent
        GL0 Cache Hit Rate (TCP Cache):
          value: 100 * SUM(TCP_REQ_sum - TCP_REQ_MISS_sum) / SUM(TCP_REQ_sum)
          unit: Percent
        GL0 Request Rate (TCP Cache):
          value: SUM(TCP_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Requests/s
        GL1C-GL2 Read BW:
          value: SUM(GL1C_GL2_REQ_READ_32B_sum * 32 + GL1C_GL2_REQ_READ_64B_sum * 64 + GL1C_GL2_REQ_READ_128B_sum * 128 + GL1C_GL2_REQ_READ_256B_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        GL2 Uncompressed Read BW:
          value: SUM(GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum * 128 + GL2C_READ_256_REQ_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Bytes/s
        Scalar Data Cache Hit Rate:
          value: 100 * SUM(SQC_DCACHE_HITS_sum) / SUM(SQC_DCACHE_HITS_sum + SQC_DCACHE_MISSES_sum)
          unit: Percent
        Scalar Data Cache Request Rate:
          value: SUM(SQC_TC_DATA_READ_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Requests/s
        Instruction Cache Hit Rate:
          value: 100 * SUM(SQC_ICACHE_HITS_sum) / SUM(SQC_ICACHE_HITS_sum + SQC_ICACHE_MISSES_sum)
          unit: Percent
        Instruction Cache Request Rate:
          value: SUM(SQC_TC_INST_REQ_sum) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          unit: Requests/s
  metrics_description:
    GL2 Cache Hit Rate: >-
      Percentage of GL2 cache requests that are serviced from cache without accessing system memory. Higher hit rates reduce memory bandwidth pressure and improve performance. Low hit rates may indicate poor data locality or working sets that exceed cache capacity.
    GL2-Fabric Read BW: >-
      Logical request bytes per second at the GL2C/EA interface, including compressed 128-byte and 256-byte requests at their logical size. This is not a measurement of physical DRAM bytes; writebacks may occur outside the dispatch interval.
    GL2-Fabric Write BW: >-
      Logical request bytes per second at the GL2C/EA interface, including compressed 128-byte and 256-byte requests at their logical size. This is not a measurement of physical DRAM bytes; writebacks may occur outside the dispatch interval.
    Wave Dependency Wait: >-
      Percentage of wavefront execution time spent waiting for data dependencies to resolve, such as pending memory operations or prior instruction results. High values indicate latency-bound execution that could benefit from increased occupancy or reduced dependency chains.
    Wave Issue Wait: >-
      Percentage of wavefront execution time spent waiting for instructions to become ready for issue. High values may indicate instruction cache misses, complex control flow, or pipeline stalls preventing instruction dispatch.
    GL0 Cache Hit Rate (TCP Cache): >-
      Percentage of GL0 vector cache (TCP Cache) requests that hit in cache. The TCP cache is the first-level cache for vector memory operations. High hit rates reduce traffic to the GL1C interface and improve memory access latency.
    Scalar Data Cache Hit Rate: >-
      Percentage of scalar data cache accesses that hit in cache. The scalar cache stores uniform data accessed by scalar instructions. High hit rates indicate efficient reuse of constant and uniform data across wavefronts.
    Instruction Cache Hit Rate: >-
      Percentage of instruction fetch requests that hit in the instruction cache. High hit rates are essential for sustained instruction throughput. Low hit rates may indicate large kernel code size or divergent control flow.
    VALU Instruction Rate: >-
      Issued VALU instructions per nanosecond, expressed as billions of instructions per second. The hardware counter counts instructions rather than per-lane operations; it does not provide a FLOP rate or a percent of arithmetic peak.
    FP64 VALU Instruction Rate: >-
      Issued double-precision VALU instructions per nanosecond, expressed as billions of instructions per second. Instruction counts do not account for active lanes or operations per instruction, so no FLOP conversion or peak is applied.
    LDS Bank Conflict Cycles: >-
      Unscaled LDS bank-conflict cycle counter, summed across WGPs and averaged across dispatches. This is a cycle count, not a number of conflicting memory accesses.
    GL0 Request Rate (TCP Cache): >-
      Hardware request count per second. Request sizes are not inferred from a fixed cache-line size.
    Scalar Data Cache Request Rate: >-
      Hardware request count per second. Request sizes are not inferred from a fixed cache-line size.
    Instruction Cache Request Rate: >-
      Hardware request count per second. Request sizes are not inferred from a fixed cache-line size.
    GL1C-GL2 Read BW: >-
      Read request bytes per second on the GL1C-to-GL2 interface, weighted by the 32, 64, 128 and 256-byte request bins. Navi4x has no GL1 cache; these counters measure the request interface.
    GL2 Uncompressed Read BW: >-
      Client-side GL2 read request bytes per second from the 32, 64, 128 and 256-byte uncompressed request bins. Compressed client requests are excluded. This is distinct from GL2-to-fabric traffic.
