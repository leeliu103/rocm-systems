# RDNA4 (gfx1201)
Panel Config:
  id: 1300
  title: GL2 Cache (L2)
  data source:
  - metric_table:
      id: 1301
      title: GL2 Cache Performance
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2 Cache Hit Rate:
          avg: 100 * SUM(GL2C_HIT_sum) / SUM(GL2C_HIT_sum + GL2C_MISS_sum)
          min: 100 * MIN(GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          max: 100 * MAX(GL2C_HIT_sum / (GL2C_HIT_sum + GL2C_MISS_sum))
          unit: Percent
        GL2 Cache Hits:
          avg: SUM(GL2C_HIT_sum) / SUM($denom)
          min: MIN(GL2C_HIT_sum / $denom)
          max: MAX(GL2C_HIT_sum / $denom)
          unit: (Count + $normUnit)
        GL2 Cache Misses:
          avg: SUM(GL2C_MISS_sum) / SUM($denom)
          min: MIN(GL2C_MISS_sum / $denom)
          max: MAX(GL2C_MISS_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1302
      title: GL2 Cache Request Statistics
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Total Requests:
          avg: SUM(GL2C_REQ_sum) / SUM($denom)
          min: MIN(GL2C_REQ_sum / $denom)
          max: MAX(GL2C_REQ_sum / $denom)
          unit: (Count + $normUnit)
        Read Requests:
          avg: SUM(GL2C_READ_sum) / SUM($denom)
          min: MIN(GL2C_READ_sum / $denom)
          max: MAX(GL2C_READ_sum / $denom)
          unit: (Count + $normUnit)
        Write Requests:
          avg: SUM(GL2C_WRITE_sum) / SUM($denom)
          min: MIN(GL2C_WRITE_sum / $denom)
          max: MAX(GL2C_WRITE_sum / $denom)
          unit: (Count + $normUnit)
        Atomic Requests:
          avg: SUM(GL2C_ATOMIC_sum) / SUM($denom)
          min: MIN(GL2C_ATOMIC_sum / $denom)
          max: MAX(GL2C_ATOMIC_sum / $denom)
          unit: (Count + $normUnit)
        EA Read Requests (DRAM):
          avg: SUM(GL2C_EA_RDREQ_DRAM_sum) / SUM($denom)
          min: MIN(GL2C_EA_RDREQ_DRAM_sum / $denom)
          max: MAX(GL2C_EA_RDREQ_DRAM_sum / $denom)
          unit: (Count + $normUnit)
        EA Write Requests (DRAM):
          avg: SUM(GL2C_EA_WRREQ_DRAM_sum) / SUM($denom)
          min: MIN(GL2C_EA_WRREQ_DRAM_sum / $denom)
          max: MAX(GL2C_EA_WRREQ_DRAM_sum / $denom)
          unit: (Count + $normUnit)
  - metric_table:
      id: 1303
      title: GL2 Cache Bandwidth
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        GL2 Uncompressed Read BW:
          avg: SUM(GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum * 128 + GL2C_READ_256_REQ_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          min: MIN((GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum * 128 + GL2C_READ_256_REQ_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
          max: MAX((GL2C_READ_32_REQ_sum * 32 + GL2C_READ_64_REQ_sum * 64 + GL2C_READ_128_REQ_sum * 128 + GL2C_READ_256_REQ_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
        GL2 Write Request BW:
          avg: SUM(GL2C_WRITE_32_REQ_sum * 32 + GL2C_WRITE_64_REQ_sum * 64 + GL2C_WRITE_128_REQ_sum * 128 + GL2C_WRITE_256_REQ_sum * 256) / (SUM(End_Timestamp - Start_Timestamp) / 1e9)
          min: MIN((GL2C_WRITE_32_REQ_sum * 32 + GL2C_WRITE_64_REQ_sum * 64 + GL2C_WRITE_128_REQ_sum * 128 + GL2C_WRITE_256_REQ_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
          max: MAX((GL2C_WRITE_32_REQ_sum * 32 + GL2C_WRITE_64_REQ_sum * 64 + GL2C_WRITE_128_REQ_sum * 128 + GL2C_WRITE_256_REQ_sum * 256) / ((End_Timestamp - Start_Timestamp) / 1e9))
          unit: Bytes/s
  metrics_description:
    GL2 Cache Hit Rate: >-
      Percentage of GL2 tag lookups counted as hits among hit and miss outcomes. A miss can be serviced outside this cache without necessarily reaching physical DRAM.
    GL2 Cache Hits: >-
      Number of GL2 cache requests that were serviced from cache. High hit counts relative to total requests indicate effective caching. Low hit counts suggest memory-bound workloads or poor data locality.
    GL2 Cache Misses: >-
      GL2 tag lookups counted as misses, including uncached reads. Misses do not by themselves identify the source that services a request.
    Total Requests: >-
      All request types measured at the GL2 tag block. A request may cause multiple tag lookups, so the count can exceed the number of requests arriving at GL2.
    Read Requests: >-
      Number of read requests to the GL2 cache. High read counts indicate memory-intensive load operations. Compare with hit rate to assess GL2 cache effectiveness for reads.
    Write Requests: >-
      Number of write requests to the GL2 cache. Write traffic includes stores forwarded through the GL1C interface; Navi4x has no GL1 cache. High write counts indicate write-intensive workloads.
    Atomic Requests: >-
      Number of atomic memory operations processed by the GL2 cache. Atomics provide thread-safe memory access but may serialize at contended addresses. High counts may impact performance.
    EA Read Requests (DRAM): >-
      GL2C/EA requests classified by the hardware as targeting DRAM. The destination classification does not establish physical DRAM bytes or exclude service from a downstream cache.
    EA Write Requests (DRAM): >-
      GL2C/EA requests classified by the hardware as targeting DRAM. The destination classification does not establish physical DRAM bytes or exclude service from a downstream cache.
    GL2 Uncompressed Read BW: >-
      Client-side GL2 request bytes per second from the explicit 32, 64, 128 and 256-byte uncompressed bins. Compressed client requests are excluded. This is distinct from traffic on the GL2C/EA interface and from physical DRAM traffic.
    GL2 Write Request BW: >-
      Client-side GL2 write request bytes per second, weighted by the explicit 32, 64, 128 and 256-byte request bins. These counters include re-compressed writes; compressed-event counts are not added again. This is distinct from traffic on the GL2C/EA interface and from physical DRAM traffic.
