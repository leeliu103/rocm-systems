# RDNA4 (gfx1201)
Panel Config:
  id: 600
  title: Workgroup Manager (SPI)
  data source:
  - metric_table:
      id: 601
      title: SPI Utilization
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        SPI Busy:
          avg: 100 * SUM(GRBM_SPI_BUSY) / SUM(GRBM_GUI_ACTIVE)
          min: 100 * MIN(GRBM_SPI_BUSY / GRBM_GUI_ACTIVE)
          max: 100 * MAX(GRBM_SPI_BUSY / GRBM_GUI_ACTIVE)
          unit: Percent
  - metric_table:
      id: 602
      title: Wave Dispatch Statistics
      header:
        metric: Metric
        avg: Avg
        min: Min
        max: Max
        unit: Unit
      metric:
        Compute Wave Dispatches:
          avg: SUM(SQ_WAVES_sum) / SUM($denom)
          min: MIN(SQ_WAVES_sum / $denom)
          max: MAX(SQ_WAVES_sum / $denom)
          unit: (Count + $normUnit)
        Wave Dispatch Rate:
          avg: SUM(SQ_WAVES_sum) / SUM(GRBM_GUI_ACTIVE)
          min: MIN(SQ_WAVES_sum / GRBM_GUI_ACTIVE)
          max: MAX(SQ_WAVES_sum / GRBM_GUI_ACTIVE)
          unit: Waves/cycle
  metrics_description:
    SPI Busy: >-
      Percentage of GPU active cycles where the Shader Processor Input is busy dispatching wavefronts. High SPI busy indicates active workload dispatch. Low values may suggest insufficient parallelism or dispatch bottlenecks limiting GPU utilization.
    Compute Wave Dispatches: >-
      Compute wavefronts launched during the kernel, summed across SQ instances and divided by the selected normalization unit.
    Wave Dispatch Rate: >-
      Compute wavefronts launched across SQ instances per GPU active cycle.
