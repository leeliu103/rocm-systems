System Speed-of-Light:
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 cache requests serviced from cache without a request to the fabric (GL2C/EA interface). Higher hit rates reduce memory bandwidth pressure and improve performance. Low hit rates may indicate poor data locality or working sets that exceed cache capacity.
    unit: Percent
  GL2-Fabric Read BW:
    rst: Logical request bytes per second at the GL2C/EA interface, including compressed 128-byte and 256-byte requests at their logical size. This is not a measurement of physical DRAM bytes; writebacks may occur outside the dispatch interval.
    unit: Bytes/s
  GL2-Fabric Write BW:
    rst: Logical request bytes per second at the GL2C/EA interface, including compressed 128-byte and 256-byte requests at their logical size. This is not a measurement of physical DRAM bytes; writebacks may occur outside the dispatch interval.
    unit: Bytes/s
  Wave Dependency Wait:
    rst: Percentage of wavefront execution time spent waiting for data dependencies to resolve, such as pending memory operations or prior instruction results. High values indicate latency-bound execution that could benefit from increased occupancy or reduced dependency chains.
    unit: Percent
  Wave Issue Wait:
    rst: Percentage of wavefront execution time spent waiting for instructions to become ready for issue. High values may indicate instruction cache misses, complex control flow, or pipeline stalls preventing instruction dispatch.
    unit: Percent
  GL0 Cache Hit Rate (TCP Cache):
    rst: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache. The TCP cache is the first-level cache for vector memory operations. High hit rates reduce traffic to the GL1C interface and improve memory access latency.
    unit: Percent
  Scalar Data Cache Hit Rate:
    rst: Percentage of scalar data cache accesses that hit in cache. The scalar cache stores uniform data accessed by scalar instructions. High hit rates indicate efficient reuse of constant and uniform data across wavefronts.
    unit: Percent
  Instruction Cache Hit Rate:
    rst: Percentage of instruction fetch requests that hit in the instruction cache. High hit rates are essential for sustained instruction throughput. Low hit rates may indicate large kernel code size or divergent control flow.
    unit: Percent
  VALU Instruction Rate:
    rst: Issued VALU instructions per nanosecond, expressed as billions of instructions per second. The hardware counter counts instructions rather than per-lane operations; it does not provide a FLOP rate or a percent of arithmetic peak.
    unit: GInstr/s
  FP64 VALU Instruction Rate:
    rst: Issued double-precision VALU instructions per nanosecond, expressed as billions of instructions per second. Instruction counts do not account for active lanes or operations per instruction, so no FLOP conversion or peak is applied.
    unit: GInstr/s
  LDS Bank Conflict Cycles per Dispatch:
    rst: Unscaled LDS bank-conflict cycle counter, summed across WGPs and averaged across dispatches. This is a cycle count, not a number of conflicting memory accesses.
    unit: Cycles
  GL0 Request Rate (TCP Cache):
    rst: Hardware request count per second. Request sizes are not inferred from a fixed cache-line size.
    unit: Requests/s
  Scalar Data Cache Request Rate:
    rst: Hardware request count per second. Request sizes are not inferred from a fixed cache-line size.
    unit: Requests/s
  Instruction Cache Request Rate:
    rst: Hardware request count per second. Request sizes are not inferred from a fixed cache-line size.
    unit: Requests/s
  GL1C-GL2 Read BW:
    rst: Read request bytes per second on the GL1C-to-GL2 interface, weighted by the 32, 64, 128 and 256-byte request bins. Navi4x has no GL1 cache; these counters measure the request interface.
    unit: Bytes/s
  GL2 Uncompressed Read BW:
    rst: Client-side GL2 read request bytes per second from the 32, 64, 128 and 256-byte uncompressed request bins. Compressed client requests are excluded. This is distinct from GL2-to-fabric traffic.
    unit: Bytes/s
Memory chart - Instruction Cache:
  ICache Requests:
    rst: Instruction cache (SQC ICache) requests per normalization unit. This is a request count; no fixed number of bytes per request is assumed.
    unit: Requests per Normalization Unit
  ICache Hit Rate:
    rst: Percentage of instruction cache accesses that are serviced from cache without fetching from the GL1C interface. High hit rates indicate good instruction locality. Low hit rates may indicate large kernels exceeding instruction cache capacity or divergent branches.
    unit: Percent
  ICache-GL1 Request Rate:
    rst: Hardware request count per second. No fixed number of bytes per request is assumed.
    unit: Requests/s
Memory chart - Scalar Data Cache:
  DCache Requests:
    rst: Scalar data cache (SQC DCache) requests per normalization unit. This is a request count; no fixed number of bytes per request is assumed.
    unit: Requests per Normalization Unit
  DCache Hit Rate:
    rst: Percentage of scalar data cache accesses that hit in cache. High hit rates indicate efficient reuse of constant and uniform data. Low hit rates may indicate excessive unique constant data or poor temporal locality.
    unit: Percent
  DCache-GL1 Request Rate:
    rst: Hardware request count per second. No fixed number of bytes per request is assumed.
    unit: Requests/s
Memory chart - TCP Cache:
  TCP Read Requests:
    rst: Read requests received by the GL0 vector cache per normalization unit. This is a request count, not a byte count.
    unit: Requests per Normalization Unit
  TCP Write Requests:
    rst: Write requests received by the GL0 vector cache per normalization unit. This is a request count, not a byte count.
    unit: Requests per Normalization Unit
  GL0 Cache Hit Rate (TCP Cache):
    rst: Percentage of GL0 vector cache (TCP Cache) requests serviced from cache. TCP Cache is the first-level cache for vector memory operations. Higher hit rates reduce traffic to the GL1C interface and lower memory access latency for vector operations.
    unit: Percent
  GL0 Request Rate (TCP Cache):
    rst: Hardware request count per second. No fixed number of bytes per request is assumed.
    unit: Requests/s
Memory chart - GL2 Cache:
  GL2 Cache Utilization:
    rst: Percentage of GL2 cache cycles reported busy, aggregated across GL2 channels. High values indicate sustained traffic through the last GPU cache level.
    unit: Percent
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 tag lookups counted as hits among hit and miss outcomes. GL2 is the last GPU cache level represented by this panel.
    unit: Percent
  GL2-Fabric Read BW:
    rst: Logical request bytes per second at the GL2C/EA interface, including compressed 128-byte and 256-byte requests at their logical size. This is not a measurement of physical DRAM bytes; writebacks may occur outside the dispatch interval.
    unit: Bytes/s
  GL2-Fabric Write BW:
    rst: Logical request bytes per second at the GL2C/EA interface, including compressed 128-byte and 256-byte requests at their logical size. This is not a measurement of physical DRAM bytes; writebacks may occur outside the dispatch interval.
    unit: Bytes/s
Memory chart - LDS (Local Data Share):
  LDS Instructions:
    rst: Issued LDS instructions, including FLAT instructions that resolve to LDS. The instruction count does not distinguish read bytes from write bytes.
    unit: Count per Normalization Unit
  LDS Bank Conflict Cycle Ratio:
    rst: LDS bank-conflict cycle counter divided by the indexed-active cycle counter. This compares hardware cycle counts; it is not the fraction of memory accesses that conflict, or a measure of LDS peak utilization.
    unit: Percent
  LDS Indexed-active Cycles:
    rst: Unscaled hardware cycle counter for indexed LDS operations, summed across WGPs. No conversion to bandwidth or percent of elapsed GPU cycles is applied.
    unit: Count per Normalization Unit
  LDS Bank Conflict Cycles:
    rst: Unscaled hardware cycle counter for LDS bank conflicts, summed across WGPs. No conversion to a count of memory accesses is applied.
    unit: Count per Normalization Unit
Memory chart - TCP-GL1 Interface:
  TCP-GL1 Read Bandwidth:
    rst: Read request bytes per second from the explicit 64-byte and 128-byte TCP-to-GL1C read request counters.
    unit: Bytes/s
  TCP-GL1 Write Request Rate:
    rst: TCP-to-GL1C write requests per second. The event does not encode a fixed byte size.
    unit: Requests/s
Memory chart - GL1C Interface:
  GL1C Interface Busy:
    rst: Percentage of GL1C interface cycles reported busy. Navi4x has no GL1 cache; this is interface activity, not cache utilization.
    unit: Percent
  GL1C Request Credit Stall:
    rst: Percentage of GL1C interface cycles stalled for GL2 request credits.
    unit: Percent
Memory chart - GL1C-GL2 Interface:
  GL1-GL2 Read Bandwidth:
    rst: Request bytes per second on the GL1C-to-GL2 interface, weighted by the explicit 32, 64, 128 and 256-byte bins.
    unit: Bytes/s
  GL1-GL2 Write Bandwidth:
    rst: Request bytes per second on the GL1C-to-GL2 interface, weighted by the explicit 32, 64, 128 and 256-byte bins.
    unit: Bytes/s
CPC Utilization:
  CPC Busy:
    rst: Percentage of time the Command Processor Compute is actively processing commands. High busy percentage indicates efficient command stream processing. Low values may indicate gaps in workload submission or dispatch bottlenecks.
    unit: Percent
  CPC Idle:
    rst: Percentage of time the Command Processor Compute has no work to process. High idle time indicates underutilization, often due to gaps between kernel dispatches or insufficient workload to keep the GPU busy.
    unit: Percent
  CPC Stalled:
    rst: Percentage of time the Command Processor Compute is stalled waiting for resources. High stall rates may indicate memory bottlenecks, synchronization issues, or contention for internal command processor resources.
    unit: Percent
CPC Interface Utilization:
  TCIU Busy:
    rst: Percentage of time the Texture Cache Interface Unit is busy handling command processor memory requests. High utilization indicates significant memory traffic from command processing activities.
    unit: Percent
  UTCL2 Busy:
    rst: Percentage of time the Unified Translation Cache L2 interface is busy handling address translation requests. High utilization may indicate heavy virtual memory activity or TLB pressure.
    unit: Percent
  GCRIU Busy:
    rst: Percentage of time the Graphics Cache Rinse Interface Unit is busy. This unit handles cache coherency operations. High utilization may indicate frequent cache flushes or synchronization points.
    unit: Percent
MEC Stall Cycles:
  ME1 Stall on RCIU Ready:
    rst: Cycles the Micro Engine is stalled waiting for the Register Cache Interface Unit. High stall counts may indicate register allocation bottlenecks or excessive register pressure during command processing.
    unit: Cycles per Normalization Unit
  ME1 Stall on Memory Read:
    rst: Cycles the Micro Engine is stalled waiting for memory read operations to complete. High stall counts indicate memory latency is impacting command processing throughput.
    unit: Cycles per Normalization Unit
  ME1 Stall on Memory Write:
    rst: Cycles the Micro Engine is stalled waiting for memory write operations to complete. High stall counts may indicate memory bandwidth saturation or write queue pressure.
    unit: Cycles per Normalization Unit
  ME1 Stall on ROQ Data:
    rst: Cycles the Micro Engine is stalled waiting for data from the Ring Output Queue. High stall counts may indicate command stream processing bottlenecks.
    unit: Cycles per Normalization Unit
CPC Memory Requests:
  TCIU Read Requests:
    rst: Number of read requests issued by the command processor through the texture cache interface. These requests fetch command buffer data and kernel arguments.
    unit: Count per Normalization Unit
  TCIU Write Requests:
    rst: Number of write requests issued by the command processor through the texture cache interface. These handle completion signals and status updates.
    unit: Count per Normalization Unit
MEC Instruction Cache:
  Instruction Cache Hits:
    rst: Number of Micro Engine instruction fetches serviced from the instruction cache. Higher hit counts indicate good instruction locality in command processing code.
    unit: Count per Normalization Unit
  Instruction Cache Misses:
    rst: Number of Micro Engine instruction fetches that missed in the instruction cache. High miss counts increase command processing latency due to memory fetches.
    unit: Count per Normalization Unit
  Instruction Cache Hit Rate:
    rst: Percentage of Micro Engine instruction fetches that hit in cache. High hit rates are essential for efficient command processing. Low rates may indicate complex or large command processing routines.
    unit: Percent
SPI Utilization:
  SPI Busy:
    rst: Percentage of GPU active cycles where the Shader Processor Input is busy dispatching wavefronts. High SPI busy indicates active workload dispatch. Low values may suggest insufficient parallelism or dispatch bottlenecks limiting GPU utilization.
    unit: Percent
Wave Dispatch Statistics:
  Compute Wave Dispatches:
    rst: Compute wavefronts launched during the kernel, summed across SQ instances and divided by the selected normalization unit.
    unit: Count per Normalization Unit
  Wave Dispatch Rate:
    rst: Compute wavefronts launched across SQ instances per GPU active cycle.
    unit: Waves/cycle
Wavefront Launch Stats:
  Grid Size:
    rst: Total number of work-items in the dispatch grid.
    unit: Work-items
  Workgroup Size:
    rst: Number of work-items per workgroup in the dispatch.
    unit: Work-items
  VGPRs:
    rst: Number of architectural vector general-purpose registers allocated per wavefront for the kernel. Higher VGPR allocation can limit the number of resident wavefronts.
    unit: Registers
  SGPRs:
    rst: Number of scalar general-purpose registers allocated per wavefront for the kernel.
    unit: Registers
  LDS Allocation:
    rst: Bytes of Local Data Share allocated per workgroup. Larger LDS allocations can limit the number of workgroups resident on a workgroup processor.
    unit: Bytes
  Scratch Allocation:
    rst: Bytes of scratch (private) memory allocated per work-item. Nonzero values usually indicate register spilling or private arrays that could not be held in registers.
    unit: Bytes per Work-item
Wave Dispatch:
  Dispatched Waves:
    rst: Number of wavefronts launched by the SQ. This is a dispatch count, not a measure of occupancy.
    unit: Waves
  Dispatched Threads:
    rst: Number of work-items launched by the SQ.
    unit: Threads
Wave Life:
  Wave Life:
    rst: Wave-cycle counter divided by dispatched waves. The wave-cycle counter uses quad-cycles (four shader clock cycles) and is nondeterministic; no busy-cycle or occupancy normalization is applied.
    unit: Quad-cycles
Wave Instruction Mix:
  Total Instructions:
    rst: Total number of instructions executed across all wavefronts. This provides an overall measure of computational work. Compare with specific instruction types to understand the workload characteristics.
    unit: Count per Normalization Unit
  Instructions - Internal:
    rst: Internal SQ instructions (SQ_INSTS_INTERNAL) per normalization unit. These represent bookkeeping or non-user-visible work issued by the SQ.
    unit: Count per Normalization Unit
  Instructions - VALU:
    rst: Number of Vector ALU instructions executed. VALU handles arithmetic and logic operations across all work-items in a wavefront. High VALU counts indicate compute-intensive kernels.
    unit: Count per Normalization Unit
  Instructions - SALU:
    rst: Number of Scalar ALU instructions executed. SALU handles operations with uniform values across the wavefront. Efficient kernels often have a balance of VALU and SALU operations.
    unit: Count per Normalization Unit
  Instructions - SMEM:
    rst: Number of scalar memory instructions executed. SMEM loads constant and uniform data through the scalar cache. High counts may indicate heavy use of constant buffers or kernel arguments.
    unit: Count per Normalization Unit
  Instructions - Transcendental:
    rst: Transcendental VALU instructions (SQ_INSTS_VALU_TRANS) per normalization unit. These cover hardware approximations such as sin, cos, and log on the vector ALU.
    unit: Count per Normalization Unit
  Instructions - VMEM:
    rst: Number of vector memory instructions executed, including global, buffer, and texture operations. High VMEM counts relative to VALU may indicate memory-bound workloads.
    unit: Count per Normalization Unit
  Instructions - LDS:
    rst: Number of Local Data Share instructions executed. LDS provides fast shared memory within a workgroup. High counts indicate active use of shared memory for inter-work-item communication.
    unit: Count per Normalization Unit
  Instructions - WMMA (VEC32):
    rst: WMMA instructions in VEC32 execution mode. The count does not identify operation precision, matrix shape, sparsity, or active lanes, so it is not converted to FLOPs.
    unit: Count per Normalization Unit
VMEM Instruction Mix:
  Instructions - VMEM Flat:
    rst: Flat-addressed instructions per normalization unit. Flat instructions resolve their address space at run time and may target global, scratch, or LDS memory.
    unit: Count per Normalization Unit
  Instructions - TEX Load:
    rst: Vector memory load instructions issued through the texture path per normalization unit. This is an instruction count, not a byte count.
    unit: Count per Normalization Unit
  Instructions - TEX Store:
    rst: Vector memory store instructions issued through the texture path per normalization unit. This is an instruction count, not a byte count.
    unit: Count per Normalization Unit
  Instructions - Flat Load:
    rst: Flat-addressed load instructions per normalization unit.
    unit: Count per Normalization Unit
  Instructions - Flat Store:
    rst: Flat-addressed store instructions per normalization unit.
    unit: Count per Normalization Unit
LDS Instruction Mix:
  LDS Direct Load Instructions:
    rst: Issued instructions counted by SQ_INSTS_LDS_DIRECT_LOAD. This is an instruction count; it does not estimate LDS data volume.
    unit: Count per Normalization Unit
  LDS Parameter Load Instructions:
    rst: Number of LDS parameter load instructions. These load shader input parameters that have been staged in LDS for efficient access by the wavefront.
    unit: Count per Normalization Unit
Wait State Analysis:
  Wait for Any:
    rst: Percentage of wavefront lifetime spent waiting for any reason. High wait percentages indicate opportunities to improve performance through better memory access patterns, reduced synchronization, or increased occupancy.
    unit: Percent
  Wait for Instruction Fetch:
    rst: Percentage of wavefront lifetime spent waiting for instruction fetch. High values may indicate instruction cache misses, large kernel code, or divergent control flow impacting instruction locality.
    unit: Percent
  Wait for Barrier:
    rst: Percentage of wavefront lifetime spent at barrier synchronization points. High barrier wait times may indicate workload imbalance within workgroups. Consider restructuring algorithms to reduce synchronization frequency.
    unit: Percent
  Wait for Counter:
    rst: Percentage of wavefront lifetime spent waiting for memory operation counters. High values indicate memory latency is impacting performance. Consider improving memory access patterns or increasing occupancy to hide latency.
    unit: Percent
WGP Instruction Cache:
  Icache Hit Rate:
    rst: Percentage of instruction cache accesses that hit. High hit rates are essential for sustained instruction throughput. Low rates may indicate large kernels or divergent branches causing instruction cache thrashing.
    unit: Percent
WGP Scalar Data Cache:
  DCache Hit Rate:
    rst: Percentage of scalar data cache accesses that hit. High hit rates indicate efficient reuse of constant and uniform data. Low rates may suggest excessive unique constant data or poor temporal locality.
    unit: Percent
GL0 Request Statistics:
  Total Requests:
    rst: Total number of requests to the GL0 vector cache, including reads, writes, and atomics. This represents the overall memory traffic generated by vector memory instructions from the shader cores.
    unit: Count per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL0 vector cache. High read counts indicate memory-intensive load operations. Compare with hit rate to assess cache effectiveness for read traffic.
    unit: Count per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL0 vector cache. Write traffic may include global memory stores and cache writebacks. High write counts indicate write-intensive workloads.
    unit: Count per Normalization Unit
  Miss Requests:
    rst: Number of GL0 cache requests that missed and required fetching from the GL1C interface. High miss counts increase memory access latency. Consider improving data locality or access patterns to reduce misses.
    unit: Count per Normalization Unit
GL0 Cache Performance:
  Hit Rate:
    rst: Percentage of GL0 cache requests serviced from cache without forwarding to the GL1C interface. Higher hit rates indicate better data locality and lower memory access latency. Low hit rates may indicate working sets exceeding GL0 capacity or poor access patterns.
    unit: Percent
GL0-GL1 Interface:
  GL1 Read Requests:
    rst: Number of read requests forwarded from GL0 (TCP) to the GL1C interface due to misses. This represents GL0 miss traffic that must be serviced by higher cache levels.
    unit: Count per Normalization Unit
  GL1 Read 128B Requests:
    rst: Number of 128-byte read requests forwarded from GL0 (TCP) to the GL1C interface. This represents large cache line fetches for memory-intensive workloads.
    unit: Count per Normalization Unit
  GL1 Write Requests:
    rst: Number of write requests forwarded from GL0 (TCP) to the GL1C interface. This includes writebacks and stores that missed in GL0.
    unit: Count per Normalization Unit
GL0 Stalls:
  TA Req Stall:
    rst: Cycles the Texture Addresser was stalled waiting for the GL0 cache to accept requests. High stall counts indicate GL0 cache backpressure limiting memory request throughput.
    unit: Cycles per Normalization Unit
  GL1 Back Pressure:
    rst: Cycles the GL0 cache was stalled due to backpressure from the GL1C interface. High values indicate GL1C interface contention or bandwidth limitations impacting GL0 throughput.
    unit: Cycles per Normalization Unit
  Data FIFO Stall:
    rst: Cycles the GL0 cache data FIFO was stalled. High stall counts may indicate data path congestion or insufficient buffering for high-throughput workloads.
    unit: Cycles per Normalization Unit
GL0 Clock Activity:
  GL0 Clock-enabled Cycles:
    rst: Cycles in which TCP core clocks are enabled, summed across TCP instances. This event is not performance-window filtered and may include activity outside the dispatch. Clock enablement does not imply a request is being serviced.
    unit: Cycles per Normalization Unit
GL1C Request Statistics:
  Total Requests:
    rst: All requests received by GL1C. Navi4x has no GL1 cache; these counters measure the request interface.
    unit: Count per Normalization Unit
  Read Requests:
    rst: Read requests received by GL1C. Navi4x has no GL1 cache; these counters measure the request interface.
    unit: Count per Normalization Unit
  Write Requests:
    rst: Write requests received by GL1C. Navi4x has no GL1 cache; these counters measure the request interface.
    unit: Count per Normalization Unit
GL1C-GL2 Interface:
  GL2 Read Requests:
    rst: Read requests sent from GL1C to GL2. Navi4x has no GL1 cache; these counters measure the request interface.
    unit: Count per Normalization Unit
  GL2 Read 128B Requests:
    rst: 128-byte read requests sent from GL1C to GL2. Navi4x has no GL1 cache; these counters measure the request interface.
    unit: Count per Normalization Unit
  GL2 Write Requests:
    rst: Write requests sent from GL1C to GL2. Navi4x has no GL1 cache; these counters measure the request interface.
    unit: Count per Normalization Unit
GL1C Interface Activity:
  GL1C Interface Busy:
    rst: Percentage of GL1C interface cycles reported busy. Navi4x has no GL1 cache.
    unit: Percent
  GL1C Interface Starve:
    rst: Percentage of GL1C interface cycles reported starved. This is request-interface activity rather than a cache hit metric.
    unit: Percent
GL1C Interface Stalls:
  GL2 Request Credit Stall:
    rst: GL1C cycles stalled for GL2 request credits.
    unit: Cycles per Normalization Unit
  Buffer Full Stall:
    rst: GL1C cycles stalled because an interface buffer is full.
    unit: Cycles per Normalization Unit
GL2 Cache Performance:
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 tag lookups counted as hits among hit and miss outcomes. A miss can be serviced outside this cache without necessarily reaching physical DRAM.
    unit: Percent
  GL2 Cache Hits:
    rst: Number of GL2 cache requests that were serviced from cache. High hit counts relative to total requests indicate effective caching. Low hit counts suggest memory-bound workloads or poor data locality.
    unit: Count per Normalization Unit
  GL2 Cache Misses:
    rst: GL2 tag lookups counted as misses, including uncached reads. Misses do not by themselves identify the source that services a request.
    unit: Count per Normalization Unit
GL2 Cache Request Statistics:
  Total Requests:
    rst: All request types measured at the GL2 tag block. A request may cause multiple tag lookups, so the count can exceed the number of requests arriving at GL2.
    unit: Count per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL2 cache. High read counts indicate memory-intensive load operations. Compare with hit rate to assess GL2 cache effectiveness for reads.
    unit: Count per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL2 cache. Write traffic includes stores forwarded through the GL1C interface; Navi4x has no GL1 cache. High write counts indicate write-intensive workloads.
    unit: Count per Normalization Unit
  Atomic Requests:
    rst: Number of atomic memory operations processed by the GL2 cache. Atomics provide thread-safe memory access but may serialize at contended addresses. High counts may impact performance.
    unit: Count per Normalization Unit
  EA Read Requests (DRAM):
    rst: GL2C/EA requests classified by the hardware as targeting DRAM. The destination classification does not establish physical DRAM bytes or exclude service from a downstream cache.
    unit: Count per Normalization Unit
  EA Write Requests (DRAM):
    rst: GL2C/EA requests classified by the hardware as targeting DRAM. The destination classification does not establish physical DRAM bytes or exclude service from a downstream cache.
    unit: Count per Normalization Unit
GL2 Cache Bandwidth:
  GL2 Uncompressed Read BW:
    rst: Client-side GL2 request bytes per second from the explicit 32, 64, 128 and 256-byte uncompressed bins. Compressed client requests are excluded. This is distinct from traffic on the GL2C/EA interface and from physical DRAM traffic.
    unit: Bytes/s
  GL2 Write Request BW:
    rst: Client-side GL2 write request bytes per second, weighted by the explicit 32, 64, 128 and 256-byte request bins. These counters include re-compressed writes; compressed-event counts are not added again. This is distinct from traffic on the GL2C/EA interface and from physical DRAM traffic.
    unit: Bytes/s
GPU Utilization:
  GPU Busy:
    rst: Percentage of time the GPU was actively processing work. This is the primary utilization metric showing overall GPU activity. Low GPU busy indicates underutilization, possibly due to insufficient workload or host-side bottlenecks.
    unit: Percent
  CP Busy:
    rst: Percentage of GPU active time the Command Processor was busy dispatching work and processing commands. High CP busy with low shader activity may indicate dispatch bottlenecks or excessive command stream overhead.
    unit: Percent
  GL2C Busy:
    rst: Percentage of GPU active time the GL2 cache was busy servicing memory requests. High GL2 busy indicates memory-intensive workloads. Compare with compute activity to determine if the workload is memory-bound or compute-bound.
    unit: Percent
Shader Engine Utilization:
  TA Busy:
    rst: Percentage of GPU active time the Texture Addresser was busy processing memory address calculations. High TA busy indicates active texture or buffer memory operations. This reflects the address generation workload for memory requests.
    unit: Percent
